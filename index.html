<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Set to the page background for the chosen theme once the app starts (App.jsx) -->
    <meta name="theme-color" content="#f5f6f7" />
    <!-- Map tiles and terrain come from these hosts; connect before the map chunk asks -->
    <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
    <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="Flood damage mapped from Sentinel-1 radar: flooded area, buildings and roads in flood zones, cut-off settlements and rescue priorities, with a situation report in English and Nepali."
    />
    <!-- How a link to the dashboard looks when it is pasted into a chat or a post -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TANGO — Flood Response System" />
    <meta
      property="og:description"
      content="Flood damage mapped from Sentinel-1 radar: where it hit, what was damaged, who is cut off, and who to reach first."
    />
    <meta name="twitter:card" content="summary" />
    <title>TANGO — Flood Response System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
